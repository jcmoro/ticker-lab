name: Daily Ingestion

on:
  schedule:
    # 16:30 UTC Mon-Fri (ECB publishes ~16:00 CET)
    - cron: "30 16 * * 1-5"
    # 08:00 UTC daily (crypto prices update continuously)
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  exchange-rates:
    name: Ingest ECB Exchange Rates
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRANKFURTER_BASE_URL: https://api.frankfurter.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ingestion
        run: pnpm --filter @ticker-lab/api job:ingest

  crypto:
    name: Ingest Crypto Prices
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/crypto-go/go.sum

      - name: Run ingestion
        run: cd apps/crypto-go && go run . ingest

  macro:
    name: Ingest Macro Indicators
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/macro-go/go.sum

      - name: Ingest FRED
        run: cd apps/macro-go && go run . ingest

      - name: Ingest ECB
        run: cd apps/macro-go && go run . ingest-ecb

      - name: Ingest BdE
        run: cd apps/macro-go && go run . ingest-bde

  esios:
    name: Ingest ESIOS Electricity
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/esios-go/go.sum

      - name: Run ingestion
        run: |
          if [ -z "$ESIOS_API_KEY" ]; then
            echo "::warning::ESIOS_API_KEY not set; skipping ingest (waiting for REE token)"
            exit 0
          fi
          cd apps/esios-go && go run . ingest

  cnmv:
    name: Ingest CNMV Funds
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/cnmv-go/go.sum

      - name: Run ingestion
        run: cd apps/cnmv-go && go run . ingest
