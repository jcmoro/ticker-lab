services:
  - type: web
    name: tickerlab
    runtime: docker
    dockerfilePath: ./docker/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3000"
      - key: API_HOST
        value: "0.0.0.0"
      - key: FRANKFURTER_BASE_URL
        value: "https://api.frankfurter.dev"
      - key: DATABASE_URL
        sync: false
      # Browser-facing URLs of the downstream Go services.
      # Updated to point at Render's per-service subdomains in production.
      - key: GO_CONVERTER_URL
        value: "https://tickerlab-go.onrender.com"
      - key: CRYPTO_GO_URL
        value: "https://tickerlab-crypto.onrender.com"
      - key: MACRO_GO_URL
        value: "https://tickerlab-macro.onrender.com"
      - key: ESIOS_GO_URL
        value: "https://tickerlab-esios.onrender.com"
      - key: CNMV_GO_URL
        value: "https://tickerlab-cnmv.onrender.com"
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - docker/api/**
        - package.json
        - pnpm-lock.yaml

  - type: web
    name: tickerlab-go
    runtime: docker
    dockerfilePath: ./docker/converter-go/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/converter-go/**
        - apps/internal/httpx/**
        - go.work
        - docker/converter-go/**

  - type: web
    name: tickerlab-crypto
    runtime: docker
    dockerfilePath: ./docker/crypto-go/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8090"
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/crypto-go/**
        - apps/internal/httpx/**
        - go.work
        - docker/crypto-go/**

  - type: web
    name: tickerlab-macro
    runtime: docker
    dockerfilePath: ./docker/macro-go/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8110"
      - key: DATABASE_URL
        sync: false
      - key: FRED_API_KEY
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/macro-go/**
        - apps/internal/httpx/**
        - go.work
        - docker/macro-go/**

  - type: web
    name: tickerlab-esios
    runtime: docker
    dockerfilePath: ./docker/esios-go/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8120"
      - key: DATABASE_URL
        sync: false
      - key: ESIOS_API_KEY
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/esios-go/**
        - apps/internal/httpx/**
        - go.work
        - docker/esios-go/**

  - type: web
    name: tickerlab-cnmv
    runtime: docker
    dockerfilePath: ./docker/cnmv-go/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: "8130"
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/cnmv-go/**
        - apps/internal/httpx/**
        - go.work
        - docker/cnmv-go/**
